<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - Find a Friend</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #74b9ff; --secondary: #ff7675; --bg: #fdfcfb; }
        body { font-family: sans-serif; padding: 20px; background: var(--bg); text-align: center; }
        .search-box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #f1f2f6; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .search-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .gift-card { background: white; padding: 18px; margin-top: 12px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.02); border-left: 5px solid var(--secondary); }
        .claim-btn { background: var(--secondary); color: white; padding: 10px 18px; border-radius: 12px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div style="text-align:left; margin-bottom:20px;">
        <a href="index.html" style="text-decoration:none; color:var(--primary); font-size:12px; font-weight:bold;">← BACK</a>
    </div>

    <div class="search-box">
        <h2 style="color:var(--primary); margin-top:0;">FIND A FRIEND</h2>
        <input type="text" id="friendName" placeholder="Friend's Username">
        <input type="text" id="listTitle" placeholder="List Name (e.g. Birthday)">
        <button class="search-btn" onclick="searchGifts()">SEARCH LIST</button>
    </div>

    <div id="results" style="margin-top:25px;"></div>

    <script>
        const KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeXlmemRob2lqaW1hY2xyZXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNTQyNjEsImV4cCI6MjA4NDYzMDI2MX0.VUURNKFnZCQBJxp2zzaNNHJ_VsgYhPKFsRpQkQLv0qc`;
        const URL = 'https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/gifts';

        async function searchGifts() {
            const user = document.getElementById('friendName').value.trim().toLowerCase();
            const list = document.getElementById('listTitle').value.trim();
            if(!user || !list) return alert("Fill in both boxes!");

            const fullID = `${user}_${list}`;
            const res = await fetch(`${URL}?list_title=eq.${fullID}`, { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            const data = await res.json();
            
            // SYSTEM_HEADER filter
            const gifts = data.filter(i => i.name !== 'SYSTEM_HEADER');

            let html = `<h3 style="color:#b2bec3; text-transform:uppercase;">${list}</h3>`;
            if(gifts.length === 0) {
                html += '<p>No gifts found for this list.</p>';
            } else {
                gifts.forEach(i => {
                    html += `<div class="gift-card">
                        <div><b>${i.name}</b><br><small>$${i.price}</small></div>
                        <button class="claim-btn" onclick="alert('Item Claimed!')">CLAIM</button>
                    </div>`;
                });
            }
            document.getElementById('results').innerHTML = html;
        }
    </script>
</body>
</html>
