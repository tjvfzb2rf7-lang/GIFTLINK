<script>
async function handleLogin() {
    const user = document.getElementById('username').value.trim().toLowerCase();
    const pin = document.getElementById('pin').value.trim();
    const btn = document.getElementById('loginBtn');

    if(!user || !pin) return alert("Enter Username and PIN");

    btn.innerText = "VERIFYING...";
    
    // 1. Check if user exists in Supabase
    const res = await fetch(`https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/users?username=eq.${user}`, {
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
    });
    const data = await res.json();

    if (data.length > 0) {
        // 2. User exists, check PIN
        if (data[0].pin === pin) {
            localStorage.setItem('giftlink_user', user);
            window.location.href = 'lists.html';
        } else {
            alert("Incorrect PIN!");
            btn.innerText = "LOG IN";
        }
    } else {
        // 3. New User? Ask to create account
        if(confirm("User not found. Create new account with this PIN?")) {
            await fetch(`https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/users`, {
                method: 'POST',
                headers: { 
                    'apikey': KEY, 
                    'Authorization': 'Bearer ' + KEY, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ username: user, pin: pin })
            });
            localStorage.setItem('giftlink_user', user);
            window.location.href = 'lists.html';
        } else {
            btn.innerText = "LOG IN";
        }
    }
}
</script>
