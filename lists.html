<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - My Lists</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #ff7675; --secondary: #74b9ff; --bg: #fdfcfb; }
        body { font-family: -apple-system, sans-serif; padding: 20px; background: var(--bg); }
        .box { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #f1f2f6; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .btn-create { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .list-card { background: white; padding: 18px; border-radius: 20px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-left: 6px solid var(--secondary); }
        .btn-group { display: flex; gap: 8px; }
        .btn-sm { padding: 10px 14px; border-radius: 10px; border: none; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-open { background: var(--secondary); color: white; }
        .btn-del { background: #ffeaa7; color: #d63031; }
    </style>
</head>
<body onload="fetchLists()">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color: var(--primary);">MY WISHLISTS</h2>
        <button onclick="localStorage.removeItem('giftlink_user'); window.location.href='index.html'" style="background:none; border:none; color:#ccc; font-size:11px; font-weight:bold; cursor:pointer;">LOGOUT</button>
    </div>
    
    <div class="box">
        <input type="text" id="listTitle" placeholder="List Name (e.g. Christmas)">
        <button class="btn-create" onclick="createList()">CREATE NEW LIST</button>
    </div>

    <div id="myLists"></div>

    <script>
        const KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeXlmemRob2lqaW1hY2xyZXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNTQyNjEsImV4cCI6MjA4NDYzMDI2MX0.VUURNKFnZCQBJxp2zzaNNHJ_VsgYhPKFsRpQkQLv0qc`;
        const URL = 'https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/gifts';
        const user = localStorage.getItem('giftlink_user');

        async function createList() {
            const title = document.getElementById('listTitle').value.trim();
            if(!title) return alert("Enter a title");
            
            await fetch(URL, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ list_title: `${user}_${title}`, name: 'SYSTEM_HEADER', price: '0' })
            });
            
            document.getElementById('listTitle').value = '';
            fetchLists(); // Instant Update
        }

        async function fetchLists() {
            const res = await fetch(`${URL}?list_title=ilike.${user}_*`, { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            const data = await res.json();
            const uniqueTitles = [...new Set(data.map(i => i.list_title.split('_')[1]))];
            
            let html = '';
            uniqueTitles.forEach(title => {
                // Admin Filter
                if (!title.toLowerCase().includes('admin')) {
                    html += `<div class="list-card">
                        <b style="font-size:16px;">${title.toUpperCase()}</b>
                        <div class="btn-group">
                            <button class="btn-sm btn-open" onclick="location.href='receiver.html?list=${title}'">OPEN</button>
                            <button class="btn-sm btn-del" onclick="deleteFullList('${title}')">DELETE</button>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('myLists').innerHTML = html || '<p style="text-align:center;color:#ccc;margin-top:30px;">No lists found. Create one above!</p>';
        }

        async function deleteFullList(title) {
            if(!confirm(`Are you sure you want to delete "${title}" and all its gifts?`)) return;
            await fetch(`${URL}?list_title=eq.${user}_${title}`, { method: 'DELETE', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            fetchLists();
        }
    </script>
</body>
</html>
