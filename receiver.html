<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - Add Gifts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #ff7675; --secondary: #74b9ff; --bg: #fdfcfb; }
        body { font-family: -apple-system, sans-serif; padding: 20px; background: var(--bg); }
        .box { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin: 8px 0 15px 0; border: 2px solid #f1f2f6; border-radius: 12px; box-sizing: border-box; }
        .add-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .share-btn { width: 100%; padding: 12px; background: var(--secondary); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .gift-row { background: white; padding: 15px; border-radius: 18px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .btn-group { display: flex; gap: 6px; }
        .action-btn { border: none; padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body onload="fetchGifts()">
    <a href="lists.html" style="text-decoration:none; color:var(--secondary); font-weight:bold; font-size:12px;">← BACK TO LISTS</a>
    
    <div class="box">
        <h3 id="displayTitle" style="margin-top:0; color:var(--primary);">LIST</h3>
        <input type="text" id="gName" placeholder="Gift Name">
        <input type="text" id="gPrice" placeholder="Price ($)">
        <button class="add-btn" onclick="addGift()">ADD GIFT</button>
        <button class="share-btn" onclick="shareList()">📤 SHARE LOGIN LINK</button>
    </div>

    <div id="giftList"></div>

    <script>
        const KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeXlmemRob2lqaW1hY2xyZXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNTQyNjEsImV4cCI6MjA4NDYzMDI2MX0.VUURNKFnZCQBJxp2zzaNNHJ_VsgYhPKFsRpQkQLv0qc`;
        const URL = 'https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/gifts';
        const params = new URLSearchParams(window.location.search);
        const list = params.get('list');
        const user = localStorage.getItem('giftlink_user');
        const fullID = `${user}_${list}`;

        async function fetchGifts() {
            document.getElementById('displayTitle').innerText = list.toUpperCase();
            const res = await fetch(`${URL}?list_title=eq.${fullID}`, { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            const data = await res.json();
            const actualGifts = data.filter(i => i.name !== 'SYSTEM_HEADER');
            
            let html = '';
            actualGifts.forEach(i => {
                html += `<div class="gift-row">
                    <div><b>${i.name}</b><br><small>$${i.price}</small></div>
                    <div class="btn-group">
                        <button class="action-btn" style="background:#74b9ff; color:white;" onclick="editGift(${i.id}, '${i.name}', '${i.price}')">EDIT</button>
                        <button class="action-btn" style="background:#ffeaa7; color:#d63031;" onclick="delGift(${i.id})">REMOVE</button>
                    </div>
                </div>`;
            });
            document.getElementById('giftList').innerHTML = html || '<p style="text-align:center;color:#ccc;">Your wishlist is empty.</p>';
        }

        async function addGift() {
            const name = document.getElementById('gName').value.trim();
            const price = document.getElementById('gPrice').value.trim() || "0";
            if(!name) return;

            await fetch(URL, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ list_title: fullID, name: name, price: price })
            });

            document.getElementById('gName').value = '';
            document.getElementById('gPrice').value = '';
            fetchGifts(); // Live Update
        }

        async function delGift(id) {
            if(!confirm("Remove this item?")) return;
            await fetch(`${URL}?id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            fetchGifts();
        }

        async function editGift(id, oldN, oldP) {
            const newN = prompt("Update Name:", oldN);
            const newP = prompt("Update Price:", oldP);
            if(!newN) return;
            await fetch(`${URL}?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newN, price: newP })
            });
            fetchGifts();
        }

        function shareList() {
            const loginUrl = window.location.origin + window.location.pathname.replace('receiver.html', 'index.html');
            navigator.clipboard.writeText(loginUrl).then(() => {
                alert(`Link Copied! Tell your friends to log in and search for:\nUser: ${user}\nList: ${list}`);
            });
        }
    </script>
</body>
</html>
