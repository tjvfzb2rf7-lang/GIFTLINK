<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - Manage List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #ff7675; --secondary: #74b9ff; --bg: #fdfcfb; --text: #2d3436; }
        body { font-family: -apple-system, sans-serif; padding: 20px; background: var(--bg); color: var(--text); }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .nav-link { text-decoration: none; color: var(--secondary); font-size: 13px; font-weight: bold; text-transform: uppercase; }
        h2 { text-align: center; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }
        .box { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        label { font-size: 11px; font-weight: bold; color: #b2bec3; text-transform: uppercase; }
        input { width: 100%; padding: 14px; margin: 8px 0 18px 0; border: 2px solid #f1f2f6; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .add-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; margin-top: 10px; border-radius: 15px; border-left: 5px solid var(--secondary); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .btn-group { display: flex; gap: 5px; }
        .action-btn { border: none; padding: 8px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body onload="fetchItems()">
    <div class="nav-header">
        <a href="lists.html" class="nav-link">← My Lists</a>
        <div id="listDisplay" style="color: #b2bec3; font-weight: bold; font-size: 12px;">LIST</div>
    </div>

    <div class="box">
        <label>Gift Item</label>
        <input type="text" id="gName" placeholder="Item name">
        <label>Price</label>
        <input type="text" id="gPrice" placeholder="0.00">
        <label>Link</label>
        <input type="text" id="gUrl" placeholder="URL link">
        <button class="add-btn" id="addBtn" onclick="addGift()">ADD GIFT</button>
    </div>

    <div id="displayArea">
        <label style="font-size: 11px; font-weight: bold; color: #b2bec3;">GIFTS IN THIS LIST</label>
        <div id="giftList"></div>
    </div>

    <script>
        const URL_BASE = 'https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/gifts';
        const KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeXlmemRob2lqaW1hY2xyZXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNTQyNjEsImV4cCI6MjA4NDYzMDI2MX0.VUURNKFnZCQBJxp2zzaNNHJ_VsgYhPKFsRpQkQLv0qc`;
        
        const params = new URLSearchParams(window.location.search);
        const listName = params.get('list') || 'General';
        const user = localStorage.getItem('giftlink_user') || 'anonymous';
        const fullID = `${user}_${listName}`;

        async function addGift() {
            const name = document.getElementById('gName').value;
            if(!name) return alert("Enter a name");
            
            document.getElementById('addBtn').innerText = "SAVING...";

            const res = await fetch(URL_BASE, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    list_title: fullID, 
                    name: name, 
                    price: document.getElementById('gPrice').value || "0", 
                    description: document.getElementById('gUrl').value || "",
                    is_nominated: false 
                })
            });

            if(res.ok) {
                document.getElementById('gName').value = '';
                document.getElementById('gPrice').value = '';
                document.getElementById('gUrl').value = '';
                fetchItems(); // REFRESH IMMEDIATELY
            } else {
                alert("Error saving. Please check your internet.");
            }
            document.getElementById('addBtn').innerText = "ADD GIFT";
        }

        async function fetchItems() {
            document.getElementById('listDisplay').innerText = listName.toUpperCase();
            const res = await fetch(`${URL_BASE}?list_title=eq.${fullID}`, {
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
            });
            const data = await res.json();
            const listArea = document.getElementById('giftList');
            
            // Filter out system items
            const filtered = data.filter(i => i.name !== 'SYSTEM_HEADER');

            if(filtered.length === 0) {
                listArea.innerHTML = '<p style="text-align:center; color:#ccc; font-size:12px; margin-top:10px;">No gifts yet.</p>';
                return;
            }

            let html = '';
            filtered.forEach(item => {
                html += `
                    <div class="item-row">
                        <div><b>${item.name}</b><br><span style="color:#636e72">$${item.price}</span></div>
                        <div class="btn-group">
                            <button class="action-btn" style="background:#74b9ff; color:white;" onclick="editGift(${item.id}, '${item.name}', '${item.price}')">EDIT</button>
                            <button class="action-btn" style="background:#ffeaa7; color:#d63031;" onclick="deleteGift(${item.id})">DEL</button>
                        </div>
                    </div>`;
            });
            listArea.innerHTML = html;
        }

        async function editGift(id, n, p) {
            const newN = prompt("New name:", n);
            const newP = prompt("New price:", p);
            if(newN === null) return;
            await fetch(`${URL_BASE}?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newN, price: newP })
            });
            fetchItems();
        }

        async function deleteGift(id) {
            if(!confirm("Delete?")) return;
            await fetch(`${URL_BASE}?id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            fetchItems();
        }
    </script>
</body>
</html>
