<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - Find a List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #ff7675; --secondary: #74b9ff; --bg: #fdfcfb; --text: #2d3436; }
        body { font-family: -apple-system, sans-serif; padding: 20px; background-color: var(--bg); color: var(--text); }
        .nav-link { text-decoration: none; color: var(--secondary); font-size: 13px; font-weight: bold; text-transform: uppercase; }
        h2 { text-align: center; color: var(--secondary); letter-spacing: 2px; text-transform: uppercase; }
        .box { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #f1f2f6; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .search-btn { width: 100%; padding: 16px; background: var(--secondary); color: white; border: none; border-radius: 15px; font-weight: bold; }
        
        /* List Card Style */
        .list-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 8px solid var(--secondary); box-shadow: 0 4px 10px rgba(0,0,0,0.03); cursor: pointer; }
        
        /* Gift Item Style */
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; margin-top: 10px; border-radius: 15px; border-left: 5px solid var(--primary); }
        .claim-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; }
        .claimed { opacity: 0.5; background: #dfe6e9 !important; border-left-color: #b2bec3; }
        .back-btn { color: var(--primary); font-size: 12px; font-weight: bold; margin-bottom: 15px; display: inline-block; text-decoration: none; }
    </style>
</head>
<body onload="checkUrlParams()">
    <a href="menu.html" class="nav-link">Main Menu</a>
    <h2>Find a Friend</h2>

    <div id="searchBox" class="box">
        <input type="text" id="friendName" placeholder="Enter friend's username...">
        <button class="search-btn" onclick="searchUser()">SEARCH</button>
    </div>

    <div id="displayArea"></div>

    <script>
        const URL_BASE = 'https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/gifts';
        const KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeXlmemRob2lqaW1hY2xyZXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNTQyNjEsImV4cCI6MjA4NDYzMDI2MX0.VUURNKFnZCQBJxp2zzaNNHJ_VsgYhPKFsRpQkQLv0qc`;

        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('search')) {
                document.getElementById('friendName').value = params.get('search');
                searchUser();
            }
        }

        async function searchUser() {
            const user = document.getElementById('friendName').value.trim();
            if(!user) return;

            const response = await fetch(`${URL_BASE}?list_title=ilike.${user}_*`, {
                method: 'GET',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
            });
            const data = await response.json();
            
            // Get unique list names (e.g. "Sian_Birthday 2026")
            const uniqueListIDs = [...new Set(data.map(item => item.list_title))];
            renderListSelection(uniqueListIDs, user);
        }

        function renderListSelection(listIDs, username) {
            const area = document.getElementById('displayArea');
            if(listIDs.length === 0) {
                area.innerHTML = '<p style="text-align:center; color:#b2bec3;">No lists found.</p>';
                return;
            }

            area.innerHTML = `<label style="font-size:11px; font-weight:bold; color:#b2bec3;">SELECT A LIST BY ${username.toUpperCase()}</label><br><br>`;
            
            listIDs.forEach(fullID => {
                const listTitle = fullID.split('_')[1] || "General";
                area.innerHTML += `
                    <div class="list-card" onclick="viewGifts('${fullID}')">
                        <b>${listTitle.toUpperCase()}</b>
                        <span style="color:var(--secondary)">VIEW →</span>
                    </div>`;
            });
        }

        async function viewGifts(fullID) {
            const response = await fetch(`${URL_BASE}?list_title=eq.${fullID}`, {
                method: 'GET',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
            });
            const gifts = await response.json();
            
            const area = document.getElementById('displayArea');
            const listTitle = fullID.split('_')[1] || "General";
            
            area.innerHTML = `<a href="#" onclick="searchUser()" class="back-btn">← BACK TO LISTS</a>
                              <h3>${listTitle.toUpperCase()}</h3>`;
            
            gifts.forEach(item => {
                const isClaimed = item.is_nominated;
                area.innerHTML += `
                    <div class="item-row ${isClaimed ? 'claimed' : ''}">
                        <div><b>${item.name}</b><br><span style="color:#636e72">$${item.price}</span></div>
                        ${isClaimed ? '<b>CLAIMED</b>' : `<button class="claim-btn" onclick="claimItem(${item.id}, '${fullID}')">CLAIM</button>`}
                    </div>`;
            });
        }

        async function claimItem(id, listID) {
            if(!confirm("Claim this gift?")) return;
            await fetch(`${URL_BASE}?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_nominated: true })
            });
            viewGifts(listID);
        }
    </script>
</body>
</html>
