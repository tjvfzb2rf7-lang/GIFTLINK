<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - Find a Friend</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #ff7675; --secondary: #74b9ff; --bg: #fdfcfb; --text: #2d3436; }
        body { font-family: -apple-system, sans-serif; padding: 20px; background-color: var(--bg); color: var(--text); }
        .nav-link { text-decoration: none; color: var(--secondary); font-size: 13px; font-weight: bold; text-transform: uppercase; }
        h2 { text-align: center; color: var(--secondary); letter-spacing: 2px; text-transform: uppercase; }
        .box { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #f1f2f6; border-radius: 12px; font-size: 16px; width:100%; box-sizing:border-box; }
        .search-btn { width: 100%; padding: 16px; background: var(--secondary); color: white; border: none; border-radius: 15px; font-weight: bold; }
        .list-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; border-left: 8px solid var(--secondary); box-shadow: 0 4px 10px rgba(0,0,0,0.03); cursor: pointer; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; margin-top: 10px; border-radius: 15px; border-left: 5px solid var(--primary); }
        .claim-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; }
        .unclaim-btn { background: none; border: none; color: var(--primary); font-size: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .claimed { opacity: 0.5; background: #dfe6e9 !important; }
        .back-btn { color: var(--primary); font-size: 12px; font-weight: bold; margin-bottom: 15px; display: inline-block; text-decoration: none; }
    </style>
</head>
<body onload="checkUrlParams()">
    <a href="menu.html" class="nav-link">Main Menu</a>
    <h2>Find a Friend</h2>
    <div id="searchBox" class="box">
        <input type="text" id="friendName" placeholder="Enter friend's username...">
        <button class="search-btn" onclick="searchUser()">SEARCH</button>
    </div>
    <div id="displayArea"></div>

    <script>
        const URL_BASE = 'https://edyyfzdhoijimaclreyy.supabase.co/rest/v1/gifts';
        const KEY = `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeXlmemRob2lqaW1hY2xyZXl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNTQyNjEsImV4cCI6MjA4NDYzMDI2MX0.VUURNKFnZCQBJxp2zzaNNHJ_VsgYhPKFsRpQkQLv0qc`;

        function checkUrlParams() {
            const s = new URLSearchParams(window.location.search).get('search');
            if(s) { document.getElementById('friendName').value = s; searchUser(); }
        }

        async function searchUser() {
            const u = document.getElementById('friendName').value.trim();
            if(!u) return;
            let rec = JSON.parse(localStorage.getItem('recent_searches') || "[]");
            if(!rec.includes(u)) { rec.push(u); localStorage.setItem('recent_searches', JSON.stringify(rec.slice(-10))); }
            const res = await fetch(`${URL_BASE}?list_title=ilike.${u}_*`, { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            const data = await res.json();
            const ids = [...new Set(data.map(i => i.list_title))];
            renderLists(ids, u);
        }

        function renderLists(ids, u) {
            const area = document.getElementById('displayArea');
            if(ids.length === 0) { area.innerHTML = '<p>No lists found.</p>'; return; }
            area.innerHTML = `<label style="font-size:11px; font-weight:bold; color:#b2bec3;">LISTS BY ${u.toUpperCase()}</label><br><br>`;
            ids.forEach(id => {
                area.innerHTML += `<div class="list-card" onclick="viewGifts('${id}')"><b>${id.split('_')[1].toUpperCase()}</b><span>→</span></div>`;
            });
        }

        async function viewGifts(id) {
            const res = await fetch(`${URL_BASE}?list_title=eq.${id}`, { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } });
            const gifts = await res.json();
            const area = document.getElementById('displayArea');
            area.innerHTML = `<a href="#" onclick="searchUser()" class="back-btn">← BACK TO LISTS</a><h3>${id.split('_')[1].toUpperCase()}</h3>`;
            gifts.forEach(i => {
                const link = i.description?.startsWith('http') ? `<a href="${i.description}" target="_blank" style="display:block; font-size:11px; color:var(--secondary); text-decoration:none; font-weight:bold;">VIEW PRODUCT 🔗</a>` : '';
                area.innerHTML += `
                    <div class="item-row ${i.is_nominated ? 'claimed' : ''}">
                        <div><b>${i.name}</b>${link}<br><span style="color:#636e72">$${i.price}</span></div>
                        <div style="display:flex; flex-direction:column; align-items:flex-end;">
                            ${i.is_nominated ? `<button class="claim-btn" style="background:#b2bec3" disabled>CLAIMED</button><button class="unclaim-btn" onclick="toggleClaim(${i.id}, '${id}', false)">UNCLAIM</button>` : `<button class="claim-btn" onclick="toggleClaim(${i.id}, '${id}', true)">CLAIM</button>`}
                        </div>
                    </div>`;
            });
        }

        async function toggleClaim(id, listId, status) {
            if(!confirm(status ? "Claim this gift?" : "Unclaim this gift?")) return;
            await fetch(`${URL_BASE}?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_nominated: status })
            });
            viewGifts(listId);
        }
    </script>
</body>
</html>
