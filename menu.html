<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #ff7675; 
            --secondary: #74b9ff; 
            --bg: #fdfcfb;
            --text: #2d3436;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
        }

        .header-section { text-align: center; margin-bottom: 40px; }
        
        h1 { 
            font-size: 32px; 
            letter-spacing: 4px; 
            color: var(--primary); 
            text-transform: uppercase;
            margin: 0;
        }

        .welcome-text {
            font-size: 14px;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .menu-container {
            width: 90%;
            max-width: 400px;
        }

        .menu-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 20px;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            border: 1px solid rgba(0,0,0,0.02);
            -webkit-tap-highlight-color: transparent;
        }

        .menu-card:active {
            transform: scale(0.96);
        }

        .menu-card h3 {
            margin: 0;
            color: var(--text);
            font-size: 20px;
            text-transform: uppercase;
        }

        .menu-card p {
            margin: 10px 0 0 0;
            color: #636e72;
            font-size: 14px;
        }

        .receiver-border { border-top: 8px solid var(--primary); }
        .giver-border { border-top: 8px solid var(--secondary); }

        .logout-link {
            margin-top: 20px;
            font-size: 12px;
            color: #d63031;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>GIFTLINK</h1>
        <div id="welcome" class="welcome-text">Select your role</div>
    </div>

    <div class="menu-container">
        
        <a href="receiver.html" class="menu-card receiver-border">
            <h3>Manage your list</h3>
            <p>Admin: Add items or remove gifts from your wishlist.</p>
        </a>

        <a href="giver.html" class="menu-card giver-border">
            <h3>Find a List</h3>
            <p>Search for a friend's wishlist and claim a gift.</p>
        </a>

    </div>

    <a href="index.html" class="logout-link">Log Out</a>

    <script>
        // Optional: Show the username if they just logged in
        const user = localStorage.getItem('giftlink_user');
        if (user) {
            document.getElementById('welcome').innerText = "Welcome back, " + user;
        }
    </script>

</body>
</html>
