<!DOCTYPE html>
<html>
<head>
    <title>GIFTLINK - Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #ff7675; --secondary: #74b9ff; --accent: #a29bfe; --bg: #fdfcfb; --text: #2d3436; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); color: var(--text); padding: 40px 20px; text-align: center; }
        h1 { color: var(--primary); letter-spacing: 4px; font-weight: 900; margin-bottom: 5px; }
        .welcome { font-size: 12px; color: #b2bec3; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 40px; }
        .box { background: white; padding: 30px 20px; border-radius: 25px; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; border-top: 8px solid transparent; }
        .box:active { transform: scale(0.95); }
        .box h3 { margin: 0; color: #2d3436; text-transform: uppercase; font-size: 18px; }
        .box p { margin: 10px 0 0 0; color: #636e72; font-size: 13px; line-height: 1.4; }
        .logout { color: var(--primary); font-size: 12px; font-weight: bold; text-decoration: none; margin-top: 30px; display: inline-block; text-transform: uppercase; }
    </style>
</head>
<body>
    <h1>GIFTLINK</h1>
    <div id="welcomeUser" class="welcome">Welcome Back</div>

    <div class="box" onclick="location.href='lists.html'" style="border-top-color: var(--primary);">
        <h3>Manage Your List</h3>
        <p>Admin: Add items or remove gifts from your wishlist.</p>
    </div>

    <div class="box" onclick="location.href='giver.html'" style="border-top-color: var(--secondary);">
        <h3>Find a List</h3>
        <p>Search for a friend's wishlist and claim a gift.</p>
    </div>

    <div class="box" onclick="location.href='friends.html'" style="border-top-color: var(--accent);">
        <h3>Social Hub</h3>
        <p>View saved friends and gifts you have claimed.</p>
    </div>

    <a href="index.html" class="logout" onclick="localStorage.clear()">Log Out</a>

    <script>
        const user = localStorage.getItem('giftlink_user') || 'Friend';
        document.getElementById('welcomeUser').innerText = `WELCOME BACK, ${user.toUpperCase()}`;
    </script>
</body>
</html>
